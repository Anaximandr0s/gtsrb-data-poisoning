seed: 42

paths:
  data_dir: data
  processed_dir: data/processed
  figures_dir: results/figures
  metrics_dir: results/metrics
  env_info: results/env_info.json
  final_summary_md: results/final_summary.md
  tsne_points: results/metrics/tsne_points.npz   # dashboard t-SNE points, written by python -m src.dashboard
  models_dir: results/models

data:
  image_size: 32
  num_classes: 43
  val_ratio: 0.10
  # data is already in memory as numpy; workers only add overhead and break notebooks on macOS/Windows
  num_workers: 0

model:
  channels: [32, 64, 128]
  fc_dim: 256
  conv_dropout: 0.2
  fc_dropout: 0.5

train:
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  patience: 5               # early stopping, in epochs without val accuracy gain
  scheduler:                # ReduceLROnPlateau on val accuracy; null disables it
    factor: 0.5
    patience: 2
  # shifts/crops would move the trigger and flips are wrong for left/right signs
  augmentation: false

backdoor:
  source_class: 14          # Stop
  target_class: 5           # Speed limit (80km/h)
  poison_rate: 0.05         # fraction of SOURCE-class training images
  trigger:
    size: 4                 # pixels
    position: bottom_right
    value: 1.0              # white, in [0, 1] pixel space

attack:
  extra_poison_rates: [0.10]  # also trained besides backdoor.poison_rate

detection:
  pca_dims: 10                # Chen et al. 2018 and ART default
  clustering:
    n_clusters: 2
    size_threshold: 0.35      # Chen et al. / ART relative-size default
  art:
    cluster_analysis: relative-size
  centroid:
    z_threshold: 3.0          # classic outlier rule: ~0.13% of a normal distribution lies above
  calibrated:                 # reference = trusted clean validation set
    space: full               # Euclidean distance to the clean centroid in all 256 dims (no PCA)
    percentile: 99            # pooled over classes after per-class median normalisation; ~1% clean flagged

remediation:
  suspect_lists: [art, centroid, oracle]   # oracle = true poison indices, reference upper bound only
  post_hoc_union: [art, centroid]          # post-hoc: chosen after seeing the remediation results

analysis:
  study_poison_rates: [0.01, 0.03, 0.05, 0.10]   # 1% and 3% are trained only for the rate study

explain:                     # visualisation only, never used for detection decisions
  attention_region: 8        # px, corner square around the 4x4 trigger (trigger + 4 px margin)
  n_gradcam_images: 4        # Stop test images shown in the Grad-CAM figure (seeded choice)
  tsne:
    perplexity: 30           # sklearn default
    pca_dims: 50             # usual PCA step before t-SNE (256 -> 50)

dashboard:                   # Streamlit dashboard: reads saved checkpoints and results only
  rates: ["5%", "10%"]       # attack-rate selector of the live inference page
  models:
    "5%":  {clean: baseline, poisoned: poisoned_r05, repaired: repaired_r05_centroid}
    "10%": {clean: baseline, poisoned: poisoned_r10, repaired: repaired_r10_art}
  photo_size: 220            # px, displayed photos (LANCZOS resize of the original file)
  min_photo_side: 80         # originals at least this large are "sharp" (defaults, galleries)
  other_classes: [1, 13, 17, 25, 33, 38]   # trigger-specificity gallery: one sharp photo per class
  n_poisoned_samples: 6
  top_k: 3
  # categorical slots validated for colour-blind separation (clean, poisoned, repaired); found/missed use status colours
  colors: {clean: "#257de0", poisoned: "#f47230", repaired: "#00b894", neutral: "#9c9c9c",
           found: "#0aac23", missed: "#dc3c3d", clustering: "#6a4ce2", art: "#f2a600", centroid: "#ee7fac"}
